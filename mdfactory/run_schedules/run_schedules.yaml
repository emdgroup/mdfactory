# Amber ff14SB + OpenFF Sage builds use Sage-style nonbonded settings. Entries with
# a `nonbonded_scheme` key are preferred for builds whose force-field family has
# that scheme (charmm or sage); otherwise the entry without the key is used.
- engine: gromacs
  system_type: proteinbox
  nonbonded_scheme: sage
  version: 1.0
  template_dir: proteinbox_amber
  run_files:
    - em.mdp
    - nvt.mdp
    - npt.mdp
    - md.mdp
  settings:
    num_gpus: 1
    num_cores: 8
    walltime: 24:00:00

- engine: gromacs
  system_type: protein_mixedbox
  nonbonded_scheme: sage
  version: 1.0
  template_dir: proteinbox_amber
  run_files:
    - em.mdp
    - nvt.mdp
    - npt.mdp
    - md.mdp
  settings:
    num_gpus: 1
    num_cores: 8
    walltime: 24:00:00
