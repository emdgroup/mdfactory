# Open-source route: Amber ff14SB (amber14sb.ff, GROMACS >= 2026) for the protein,
# OpenFF Sage for the ethanol solute, and native TIP3P water and ions.
# No CGenFF/SILCSBIO installation is needed.
simulation_type: protein_mixedbox
engine: gromacs
parametrization: amber
parametrization_config:
  type: amber
  forcefield: amber14sb
  water_model: tip3p
  ignore_hydrogens: true
  sage_forcefield: openff-2.2.0.offxml

system:
  protein:
    resname: LYZ
    count: 1
    pdb_path: ../proteinbox/1aki.pdb
    chains: [A]
    disulfide_bonds:
      - [CYS6, CYS127]
      - [CYS30, CYS115]
      - [CYS64, CYS80]
      - [CYS76, CYS94]
    protonation_states:
      HIS15: HIE
  species:
    # ~53 M water leaves room for the 1 M ethanol (about 1.0 g/mL solvent). The
    # 55 M + 1 M of the CHARMM example over-fills the box for TIP3P + Sage.
    - smiles: O
      resname: SOL
      concentration: 53.0
    - smiles: CCO
      resname: ETH
      concentration: 1.0
  sizing:
    type: fixed_box
    box_size: 72.0
  padding: 12.0
  concentration_volume_basis: protein_excluded
  partial_specific_volume: 0.73
  relax_steps: 10000
  ionization:
    # Salt is added on top of neutralization (and any packed ion species),
    # resolved against concentration_volume_basis. Set concentration: 0 to add
    # no salt and set ionic strength via packed ion species instead.
    neutralize: true
    concentration: 0.15
