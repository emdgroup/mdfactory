simulation_type: proteinbox
engine: gromacs
parametrization: pdb2gmx
parametrization_config:
  type: pdb2gmx
  forcefield: charmm36m
  water_model: tip3p
  ignore_hydrogens: true

system:
  protein:
    resname: LYZ
    count: 1
    pdb_path: ./1aki.pdb
    chains: [A]
    disulfide_bonds:
      - [CYS6, CYS127]
      - [CYS30, CYS115]
      - [CYS64, CYS80]
      - [CYS76, CYS94]
    protonation_states:
      HIS15: HIE
  padding: 12.0
  ionization:
    neutralize: true
    concentration: 0.15
